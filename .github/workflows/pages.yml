name: Pruebas y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias (lockfile exacto)
        run: npm ci
      - name: Pruebas del motor
        run: npm test
      - name: El CSS compilado está al día
        run: |
          npm run css
          git diff --exit-code -- css/app.css
      - name: Sin recursos de terceros
        run: |
          ! grep -nE "https?://(fonts\.|cdn\.|unpkg|jsdelivr)" index.html js/*.js css/app.css
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html css js assets docs _site/
          rm _site/css/src.css
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ./_site

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
