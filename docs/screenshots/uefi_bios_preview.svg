<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#020617; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="biosGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000084" />
      <stop offset="100%" stop-color="#000054" />
    </linearGradient>
    <linearGradient id="diplomaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Left Side: Interactive UEFI BIOS Setup Utility (680px width) -->
  <g transform="translate(30, 30)">
    <!-- BIOS Window frame -->
    <rect width="680" height="615" rx="4" fill="url(#biosGrad)" stroke="#aaaaaa" stroke-width="2" />
    
    <!-- Top BIOS Bar -->
    <rect x="0" y="0" width="680" height="30" fill="#aaaaaa" />
    <text x="340" y="21" fill="#000084" font-size="14" font-weight="bold" text-anchor="middle">Aptio Setup Utility - Copyright (C) 2026 American Megatrends, Inc.</text>

    <!-- Menu tabs -->
    <rect x="0" y="30" width="680" height="26" fill="#0000aa" />
    <text x="25" y="47" fill="#ffffff" font-size="12">Main</text>
    <rect x="68" y="32" width="95" height="22" fill="#aaaaaa" />
    <text x="115" y="47" fill="#000084" font-size="12" font-weight="bold" text-anchor="middle">Advanced</text>
    <text x="180" y="47" fill="#ffffff" font-size="12">Thermal / Fan</text>
    <text x="300" y="47" fill="#ffffff" font-size="12">Security</text>
    <text x="385" y="47" fill="#ffffff" font-size="12">Boot Priority</text>
    <text x="500" y="47" fill="#ffffff" font-size="12">Save &amp; Exit</text>

    <!-- Main BIOS Area Divider -->
    <line x1="0" y1="56" x2="680" y2="56" stroke="#aaaaaa" stroke-width="1.5" />
    <line x1="470" y1="56" x2="470" y2="535" stroke="#aaaaaa" stroke-width="1.5" />
    <line x1="0" y1="535" x2="680" y2="535" stroke="#aaaaaa" stroke-width="1.5" />

    <!-- Left Settings Pane -->
    <g transform="translate(25, 75)">
      <text x="0" y="15" fill="#ffff55" font-size="12" font-weight="bold">CPU &amp; Memory Configuration</text>
      
      <text x="0" y="45" fill="#ffffff" font-size="11">Processor Type</text>
      <text x="260" y="45" fill="#55ffff" font-size="11">AMD Ryzen 7 7800X3D 8-Core</text>

      <text x="0" y="70" fill="#ffffff" font-size="11">CPU Base Frequency</text>
      <text x="260" y="70" fill="#55ffff" font-size="11">4200 MHz</text>

      <text x="0" y="95" fill="#ffffff" font-size="11">Total Installed Memory</text>
      <text x="260" y="95" fill="#55ffff" font-size="11">32768 MB (DDR5 Dual Channel)</text>

      <line x1="0" y1="115" x2="420" y2="115" stroke="#5555ff" stroke-width="1" />

      <!-- Selected Item (Highlight bar) -->
      <rect x="-6" y="128" width="435" height="24" fill="#ffffff" />
      <text x="0" y="145" fill="#000084" font-size="12" font-weight="bold">AMD EXPO / Intel XMP Profile</text>
      <text x="260" y="145" fill="#000084" font-size="12" font-weight="bold">[Profile 1: 6000 MT/s]</text>

      <text x="0" y="180" fill="#ffffff" font-size="11">Precision Boost Overdrive</text>
      <text x="260" y="180" fill="#55ffff" font-size="11">[Enabled - Auto]</text>

      <text x="0" y="205" fill="#ffffff" font-size="11">PCIe Subsystem Gen 5.0 Mode</text>
      <text x="260" y="205" fill="#55ffff" font-size="11">[Enabled x16]</text>

      <text x="0" y="230" fill="#ffffff" font-size="11">SATA / NVMe RAID Controller</text>
      <text x="260" y="230" fill="#55ffff" font-size="11">[AHCI / NVMe Native]</text>

      <line x1="0" y1="250" x2="420" y2="250" stroke="#5555ff" stroke-width="1" />

      <text x="0" y="275" fill="#ffff55" font-size="12" font-weight="bold">Hardware Monitor Telemetry</text>
      <text x="0" y="300" fill="#ffffff" font-size="11">CPU Die Core Temperature</text>
      <text x="260" y="300" fill="#55ff55" font-size="11">+38.5 °C / +101.3 °F</text>

      <text x="0" y="325" fill="#ffffff" font-size="11">Motherboard VRM Temp</text>
      <text x="260" y="325" fill="#55ff55" font-size="11">+41.0 °C</text>

      <text x="0" y="350" fill="#ffffff" font-size="11">CPU Fan Speed (Tachometer)</text>
      <text x="260" y="350" fill="#55ffff" font-size="11">1240 RPM (PWM Auto)</text>

      <text x="0" y="375" fill="#ffffff" font-size="11">VCORE Line Voltage</text>
      <text x="260" y="375" fill="#55ff55" font-size="11">+1.185 V [OK]</text>

      <text x="0" y="400" fill="#ffffff" font-size="11">+12V Rail Sensing</text>
      <text x="260" y="400" fill="#55ff55" font-size="11">+12.080 V [OK]</text>

      <text x="0" y="425" fill="#ffffff" font-size="11">+5.0V Rail Sensing</text>
      <text x="260" y="425" fill="#55ff55" font-size="11">+5.020 V [OK]</text>
    </g>

    <!-- Right Help & Item Description Pane -->
    <g transform="translate(485, 75)">
      <text x="0" y="15" fill="#ffff55" font-size="11" font-weight="bold">Item Help</text>
      <text x="0" y="45" fill="#ffffff" font-size="10">Loads extreme memory</text>
      <text x="0" y="60" fill="#ffffff" font-size="10">profile timings and</text>
      <text x="0" y="75" fill="#ffffff" font-size="10">sub-timings verified</text>
      <text x="0" y="90" fill="#ffffff" font-size="10">by manufacturer.</text>

      <text x="0" y="125" fill="#55ffff" font-size="10">Target Frequency:</text>
      <text x="0" y="140" fill="#ffffff" font-size="10">DDR5-6000 CL30</text>
      <text x="0" y="155" fill="#ffffff" font-size="10">VDD: 1.35V</text>

      <line x1="0" y1="180" x2="175" y2="180" stroke="#5555ff" stroke-width="1" />

      <text x="0" y="205" fill="#aaaaaa" font-size="10">Notice:</text>
      <text x="0" y="220" fill="#aaaaaa" font-size="9">Ensure adequate airflow</text>
      <text x="0" y="233" fill="#aaaaaa" font-size="9">across DRAM modules</text>
      <text x="0" y="246" fill="#aaaaaa" font-size="9">when overclocking.</text>
    </g>

    <!-- Bottom Key Legend -->
    <g transform="translate(25, 555)">
      <text x="0" y="15" fill="#ffffff" font-size="10"><tspan fill="#ffff55">→←</tspan>: Select Screen</text>
      <text x="140" y="15" fill="#ffffff" font-size="10"><tspan fill="#ffff55">↑↓</tspan>: Select Item</text>
      <text x="260" y="15" fill="#ffffff" font-size="10"><tspan fill="#ffff55">Enter</tspan>: Select / Submenu</text>
      <text x="440" y="15" fill="#ffffff" font-size="10"><tspan fill="#ffff55">F10</tspan>: Save &amp; Exit</text>
      <text x="560" y="15" fill="#ffffff" font-size="10"><tspan fill="#ffff55">ESC</tspan>: Exit</text>
    </g>
  </g>

  <!-- Right Side: Educational SMR Certification Diploma Preview (430px width) -->
  <g transform="translate(740, 30)">
    <rect width="430" height="615" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="0" y="0" width="430" height="50" rx="12" fill="#1e293b" />
    <text x="215" y="32" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">CERTIFICACIÓN TÉCNICA SMR / ASIR</text>

    <!-- Diploma Container -->
    <g transform="translate(25, 70)">
      <rect width="380" height="420" rx="8" fill="#fffdfa" stroke="url(#diplomaBorder)" stroke-width="6" />
      <rect x="8" y="8" width="364" height="404" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2" />

      <!-- Ghost Watermark in center -->
      <circle cx="190" cy="200" r="70" fill="#fef3c7" opacity="0.4" />

      <text x="190" y="45" fill="#92400e" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2" font-family="sans-serif">DIPLOMA ACREDITATIVO OFICIAL</text>
      <text x="190" y="70" fill="#1e293b" font-size="16" font-weight="900" text-anchor="middle" font-family="sans-serif">TÉCNICO DE HARDWARE</text>
      <text x="190" y="88" fill="#b45309" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">MONTAJE Y MANTENIMIENTO DE EQUIPOS</text>

      <line x1="80" y1="102" x2="300" y2="102" stroke="#d97706" stroke-width="1" />

      <text x="190" y="125" fill="#64748b" font-size="9" text-anchor="middle" font-family="sans-serif">Se certifica que el alumno/a ha superado con éxito las pruebas de:</text>
      
      <text x="190" y="150" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">• Ensamblaje Físico ATX &amp; Portátiles</text>
      <text x="190" y="168" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">• Diagnóstico Multímetro DMM y Tolerancias</text>
      <text x="190" y="186" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">• Interpretación de POST Display y Beep Codes</text>
      <text x="190" y="204" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">• Configuración UEFI BIOS y Curvas Térmicas</text>

      <!-- Grade Stamp -->
      <g transform="translate(140, 230)">
        <circle cx="50" cy="50" r="44" fill="#ecfdf5" stroke="#10b981" stroke-width="3" />
        <text x="50" y="42" fill="#065f46" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">CALIFICACIÓN</text>
        <text x="50" y="66" fill="#047857" font-size="20" font-weight="900" text-anchor="middle" font-family="sans-serif">10 / 10</text>
        <text x="50" y="80" fill="#065f46" font-size="8" font-weight="bold" text-anchor="middle" font-family="sans-serif">SOBRESALIENTE</text>
      </g>

      <!-- Signature & Issuing Entity -->
      <line x1="60" y1="365" x2="160" y2="365" stroke="#334155" stroke-width="1" />
      <text x="110" y="380" fill="#475569" font-size="8" text-anchor="middle" font-family="sans-serif">Firma Docente SMR</text>

      <line x1="220" y1="365" x2="320" y2="365" stroke="#334155" stroke-width="1" />
      <text x="270" y="380" fill="#475569" font-size="8" text-anchor="middle" font-family="sans-serif">Un Fantasma en el Sistema</text>
      <text x="270" y="392" fill="#2563eb" font-size="7" text-anchor="middle" font-family="sans-serif">unfantasmaenelsistema.com</text>
    </g>

    <!-- Quiz Action Button Mock -->
    <rect x="25" y="520" width="380" height="42" rx="8" fill="#10b981" />
    <text x="215" y="546" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">★ EVALUACIÓN DE CONOCIMIENTOS (10 PREGUNTAS)</text>
    
    <text x="215" y="585" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Permite generar e imprimir el diploma con tu nombre</text>
  </g>
</svg>
