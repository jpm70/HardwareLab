<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="ironbow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000033" />
      <stop offset="25%" stop-color="#49006a" />
      <stop offset="50%" stop-color="#ae017e" />
      <stop offset="75%" stop-color="#f768a1" />
      <stop offset="90%" stop-color="#fec44f" />
      <stop offset="100%" stop-color="#ffffd4" />
    </linearGradient>
    <linearGradient id="dmmScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a9a60" />
      <stop offset="100%" stop-color="#65854b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#00e5ff" stroke-width="1">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" />
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675" />
  </g>

  <!-- Top bar header -->
  <rect x="0" y="0" width="1200" height="56" fill="#0d1424" stroke="#1f293d" stroke-width="1" />
  <circle cx="36" cy="28" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <path d="M28,28 L34,34 L44,22" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="64" y="34" fill="#f8fafc" font-size="16" font-weight="bold" letter-spacing="0.5">MÓDULO DE DIAGNÓSTICO AVANZADO • HARDWARE LAB</text>
  <rect x="940" y="14" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="1050" y="32" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle">MODO: BREAK &amp; FIX ACTIVO</text>

  <!-- Left Column: Digital Multimeter DMM (Fluke 87V style) -->
  <g transform="translate(40, 80)">
    <rect width="360" height="550" rx="16" fill="#111827" stroke="#f59e0b" stroke-width="3" />
    <!-- Yellow rubber holster rim -->
    <rect x="-6" y="-6" width="372" height="562" rx="20" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.3" />
    
    <!-- Multimeter Header -->
    <rect x="0" y="0" width="360" height="50" rx="16" fill="#1e293b" />
    <text x="24" y="32" fill="#fbbf24" font-size="16" font-weight="900" letter-spacing="1">FLUKE-SIM 87V</text>
    <text x="230" y="32" fill="#94a3b8" font-size="11" font-weight="600">TRUE RMS MULTIMETER</text>

    <!-- LCD Display -->
    <rect x="24" y="66" width="312" height="110" rx="6" fill="url(#dmmScreen)" stroke="#2b3b20" stroke-width="3" />
    <text x="40" y="90" fill="#1c2d12" font-size="12" font-family="monospace" font-weight="bold">DC VOLTS • AUTO RANGE • FAST 40Hz</text>
    <text x="40" y="152" fill="#0f1c07" font-size="54" font-family="monospace" font-weight="900" letter-spacing="2">+12.08</text>
    <text x="290" y="148" fill="#0f1c07" font-size="32" font-family="monospace" font-weight="bold">V</text>
    <!-- Bar graph under digits -->
    <rect x="40" y="162" width="280" height="6" fill="#3f542a" rx="2" />
    <rect x="40" y="162" width="180" height="6" fill="#0f1c07" rx="2" />

    <!-- Rotary Switch Area -->
    <circle cx="180" cy="270" r="70" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <circle cx="180" cy="270" r="45" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <!-- Switch pointer pointing to DC V -->
    <line x1="180" y1="270" x2="180" y2="230" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <circle cx="180" cy="270" r="10" fill="#f59e0b" />
    <!-- Switch labels -->
    <text x="180" y="190" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">V⎓ (DC)</text>
    <text x="260" y="240" fill="#94a3b8" font-size="11" font-weight="bold">V~ (AC)</text>
    <text x="260" y="300" fill="#94a3b8" font-size="11" font-weight="bold">Ω / Contin</text>
    <text x="180" y="358" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">OFF</text>
    <text x="100" y="275" fill="#94a3b8" font-size="11" font-weight="bold">Hz / Temp</text>

    <!-- Test Probe sockets -->
    <g transform="translate(0, 390)">
      <circle cx="70" cy="40" r="18" fill="#090d16" stroke="#ef4444" stroke-width="4" />
      <text x="70" y="76" fill="#94a3b8" font-size="10" text-anchor="middle">A / 10A MAX</text>

      <circle cx="145" cy="40" r="18" fill="#090d16" stroke="#ef4444" stroke-width="4" />
      <text x="145" y="76" fill="#94a3b8" font-size="10" text-anchor="middle">mA / μA</text>

      <circle cx="215" cy="40" r="18" fill="#090d16" stroke="#1e293b" stroke-width="4" />
      <circle cx="215" cy="40" r="12" fill="#000" />
      <text x="215" y="76" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">COM (GND)</text>

      <circle cx="290" cy="40" r="18" fill="#090d16" stroke="#ef4444" stroke-width="5" />
      <circle cx="290" cy="40" r="12" fill="#ef4444" fill-opacity="0.6" />
      <text x="290" y="76" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">V - Ω - ➜|</text>
    </g>

    <!-- ATX Pin Probe readout status badge -->
    <rect x="24" y="490" width="312" height="42" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1.5" />
    <text x="180" y="516" fill="#34d399" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">PUNTO DE PRUEBA: PIN 10 (+12V1) • TOLERANCIA OK (±5%)</text>
  </g>

  <!-- Center Column: Thermal FLIR Camera Simulation -->
  <g transform="translate(430, 80)">
    <rect width="360" height="550" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="360" height="46" rx="16" fill="#1e293b" />
    <text x="20" y="28" fill="#38bdf8" font-size="15" font-weight="bold">TERMOGRAFÍA FLIR (IRONBOW)</text>
    <rect x="270" y="12" width="75" height="22" rx="4" fill="#0369a1" />
    <text x="307" y="27" fill="#ffffff" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">LIVE IR</text>

    <!-- Thermal Viewport Frame -->
    <rect x="18" y="60" width="290" height="290" rx="8" fill="#020617" stroke="#1e293b" stroke-width="2" />
    
    <!-- Heat distribution mock (CPU VRM hot spot, Socket, RAM, Chipset) -->
    <!-- Cool motherboard base (violet/dark blue) -->
    <rect x="24" y="66" width="278" height="278" rx="6" fill="#2d004b" />
    
    <!-- VRM hot area (Orange-yellow heat blob) -->
    <circle cx="100" cy="120" r="38" fill="#e7298a" opacity="0.8" />
    <circle cx="100" cy="120" r="24" fill="#fe9929" opacity="0.9" />
    <circle cx="100" cy="120" r="14" fill="#ffffd4" />
    <text x="100" y="90" fill="#fef08a" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">VRM: 78.4°C</text>

    <!-- CPU Center Area -->
    <rect x="110" y="130" width="85" height="85" rx="6" fill="#980043" opacity="0.85" />
    <circle cx="152" cy="172" r="28" fill="#df65b0" opacity="0.9" />
    <circle cx="152" cy="172" r="16" fill="#ffeda0" />
    <!-- Crosshair on CPU Spot -->
    <circle cx="152" cy="172" r="8" fill="none" stroke="#00ffff" stroke-width="1.5" />
    <line x1="138" y1="172" x2="166" y2="172" stroke="#00ffff" stroke-width="1.5" />
    <line x1="152" y1="158" x2="152" y2="186" stroke="#00ffff" stroke-width="1.5" />
    <text x="152" y="215" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">SPOT: 62.1°C</text>

    <!-- RAM Slots thermal trace -->
    <rect x="215" y="110" width="14" height="110" rx="2" fill="#ce1256" opacity="0.7" />
    <rect x="235" y="110" width="14" height="110" rx="2" fill="#ce1256" opacity="0.7" />
    <text x="230" y="100" fill="#fdae6b" font-size="9" font-family="monospace" text-anchor="middle">DRAM: 44°C</text>

    <!-- GPU Area Heat (lower) -->
    <rect x="50" y="240" width="220" height="70" rx="4" fill="#67001f" opacity="0.8" />
    <ellipse cx="140" cy="275" rx="50" ry="22" fill="#df65b0" opacity="0.85" />
    <circle cx="140" cy="275" r="14" fill="#fee08b" />
    <text x="140" y="280" fill="#000" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">GPU: 69°C</text>

    <!-- Thermal Palette Scale bar (right side of viewport) -->
    <rect x="318" y="60" width="22" height="290" rx="4" fill="url(#ironbow)" stroke="#334155" stroke-width="1" />
    <text x="329" y="75" fill="#000000" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">85°</text>
    <text x="329" y="200" fill="#ffffff" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">55°</text>
    <text x="329" y="340" fill="#ffffff" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">25°</text>

    <!-- Thermal Stats Summary Cards -->
    <g transform="translate(18, 365)">
      <rect width="324" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="bold">ANÁLISIS DE DISIPACIÓN TÉRMICA</text>
      <text x="16" y="44" fill="#f8fafc" font-size="12">Pasta Térmica: <tspan fill="#34d399" font-weight="bold">CORRECTA (Kryonaut ~12.5 W/mK)</tspan></text>
      <text x="16" y="62" fill="#f8fafc" font-size="12">Flujo Chasis: <tspan fill="#38bdf8" font-weight="bold">Presión Positiva (3x IN / 1x OUT)</tspan></text>
    </g>

    <!-- Thermal alert box -->
    <g transform="translate(18, 452)">
      <rect width="324" height="80" rx="8" fill="#1c1917" stroke="#ea580c" stroke-width="1.5" />
      <text x="16" y="24" fill="#fdba74" font-size="11" font-weight="bold">DIAGNÓSTICO TÉRMICO SMR</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="11">Delta T (Ambiente 22°C): +40.1°C.</text>
      <text x="16" y="62" fill="#a7f3d0" font-size="11">Régimen acústico ventilador: 1180 RPM (Silencioso)</text>
    </g>
  </g>

  <!-- Right Column: POST Diagnosis + Beep Synthesizer + EZ Debug -->
  <g transform="translate(820, 80)">
    <rect width="340" height="550" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="340" height="46" rx="16" fill="#1e293b" />
    <text x="20" y="28" fill="#10b981" font-size="15" font-weight="bold">POST DISPLAY &amp; BEEP ENGINE</text>

    <!-- 7-Segment Hex POST Display -->
    <g transform="translate(20, 60)">
      <rect width="300" height="120" rx="10" fill="#020617" stroke="#1e293b" stroke-width="2" />
      <text x="16" y="24" fill="#64748b" font-size="11" font-family="monospace">Q-CODE 2-DIGIT DISPLAY</text>
      
      <!-- Big Red 7-segment hex digits: "AA" (POST Successful) -->
      <g transform="translate(65, 30)">
        <rect width="70" height="75" rx="6" fill="#1a0505" stroke="#450a0a" stroke-width="1" />
        <text x="35" y="60" fill="#ef4444" font-size="54" font-family="monospace" font-weight="900" text-anchor="middle" letter-spacing="-2">A</text>
        
        <g transform="translate(95, 0)">
          <rect width="70" height="75" rx="6" fill="#1a0505" stroke="#450a0a" stroke-width="1" />
          <text x="35" y="60" fill="#ef4444" font-size="54" font-family="monospace" font-weight="900" text-anchor="middle" letter-spacing="-2">A</text>
        </g>
      </g>
      <text x="150" y="112" fill="#22c55e" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">HEX AA: OS BOOT CONTROL TRANSFERRED</text>
    </g>

    <!-- EZ Debug LEDs (CPU, DRAM, VGA, BOOT) -->
    <g transform="translate(20, 195)">
      <rect width="300" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#cbd5e1" font-size="12" font-weight="bold">EZ DEBUG LEDS (ESTADO DE ETAPAS)</text>

      <g transform="translate(20, 38)">
        <!-- CPU LED -->
        <circle cx="20" cy="18" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <circle cx="20" cy="18" r="4" fill="#34d399" />
        <text x="20" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">CPU</text>

        <!-- DRAM LED -->
        <circle cx="90" cy="18" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <circle cx="90" cy="18" r="4" fill="#34d399" />
        <text x="90" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">DRAM</text>

        <!-- VGA LED -->
        <circle cx="160" cy="18" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <circle cx="160" cy="18" r="4" fill="#34d399" />
        <text x="160" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">VGA</text>

        <!-- BOOT LED -->
        <circle cx="230" cy="18" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <circle cx="230" cy="18" r="4" fill="#34d399" />
        <text x="230" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">BOOT</text>
      </g>
    </g>

    <!-- Web Audio API Synthesizer Box -->
    <g transform="translate(20, 300)">
      <rect width="300" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="bold">SINTETIZADOR BEEP CODES (WEB AUDIO)</text>
      
      <!-- Audio Wave Visualizer Simulation -->
      <path d="M20,60 Q40,35 60,60 T100,60 T140,60 T180,60 T220,60 T260,60 T280,60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
      
      <text x="16" y="85" fill="#f8fafc" font-size="11">Norma BIOS: <tspan fill="#fbbf24" font-weight="bold">AMI BIOS (American Megatrends)</tspan></text>
      <text x="16" y="103" fill="#f8fafc" font-size="11">Patrón acústico: <tspan fill="#34d399" font-weight="bold">1 Pitido Corto (880 Hz, 120ms)</tspan></text>
      <text x="16" y="120" fill="#94a3b8" font-size="10">Significado: "Todos los subsistemas superan el POST".</text>
    </g>

    <!-- Quick Actions -->
    <g transform="translate(20, 445)">
      <rect width="300" height="85" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="22" fill="#94a3b8" font-size="11" font-weight="bold">ACCIONES DE BANCO DE PRUEBAS</text>
      
      <rect x="14" y="34" width="130" height="38" rx="6" fill="#10b981" />
      <text x="79" y="58" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">▶ ENCENDER</text>

      <rect x="156" y="34" width="130" height="38" rx="6" fill="#334155" />
      <text x="221" y="58" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">PROBAR DMM</text>
    </g>
  </g>

  <!-- Watermark / Footer branding -->
  <text x="600" y="655" fill="#475569" font-size="11" text-anchor="middle" letter-spacing="1">UN FANTASMA EN EL SISTEMA • PROYECTO EDUCATIVO DE MONTAJE Y MANTENIMIENTO DE EQUIPOS (SMR / ASIR)</text>
</svg>
