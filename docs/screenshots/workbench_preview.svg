<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#070a12;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgG)" />

  <!-- Window Frame Chrome -->
  <rect x="20" y="20" width="1160" height="635" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Window Header Bar -->
  <rect x="20" y="20" width="1160" height="55" rx="16" fill="#090d16" />
  <circle cx="50" cy="48" r="6" fill="#ef4444" />
  <circle cx="70" cy="48" r="6" fill="#f59e0b" />
  <circle cx="90" cy="48" r="6" fill="#10b981" />

  <!-- Logo & Title -->
  <image href="/public/assets/aistudio/icono_81a3db5b.png" x="120" y="28" width="40" height="40" />
  <text x="175" y="46" fill="#ffffff" font-size="16" font-weight="bold">HardwareLab v3.5</text>
  <text x="320" y="46" fill="#06b6d4" font-size="12" font-family="monospace">| unfantasmaenelsistema.com</text>

  <!-- Top Badges -->
  <rect x="540" y="34" width="120" height="28" rx="8" fill="#0891b2" />
  <text x="600" y="52" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Torre ATX</text>
  <rect x="670" y="34" width="140" height="28" rx="8" fill="#1e293b" />
  <text x="740" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Portátil (Laptop)</text>

  <!-- Power Button -->
  <rect x="1010" y="34" width="140" height="28" rx="8" fill="#059669" />
  <circle cx="1030" cy="48" r="4" fill="#ffffff" />
  <text x="1080" y="52" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">ENCENDIDO (AA)</text>

  <!-- Telemetry Bar -->
  <rect x="35" y="85" width="1130" height="35" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="50" y="107" fill="#f59e0b" font-size="11" font-weight="bold">⚡ BALANCE ELÉCTRICO:</text>
  <rect x="190" y="97" width="140" height="12" rx="6" fill="#1e293b" />
  <rect x="190" y="97" width="45" height="12" rx="6" fill="#10b981" />
  <text x="340" y="107" fill="#cbd5e1" font-size="11" font-family="monospace">115W / 850W (14%)</text>
  <text x="540" y="107" fill="#94a3b8" font-size="11">Temp CPU: <tspan fill="#38bdf8" font-weight="bold">38°C</tspan></text>
  <text x="670" y="107" fill="#94a3b8" font-size="11">Temp GPU: <tspan fill="#e2e8f0" font-weight="bold">34°C</tspan></text>
  <text x="800" y="107" fill="#94a3b8" font-size="11">Ventiladores: <tspan fill="#34d399" font-weight="bold">950 RPM</tspan></text>
  <rect x="940" y="90" width="105" height="24" rx="6" fill="#7e22ce" />
  <text x="992" y="106" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">📷 FLIR Térmica</text>
  <rect x="1055" y="90" width="100" height="24" rx="6" fill="#d97706" />
  <text x="1105" y="106" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">⚡ Multímetro</text>

  <!-- Left Column: Catalog -->
  <rect x="35" y="130" width="280" height="510" rx="12" fill="#0b1120" stroke="#1e293b" />
  <text x="50" y="155" fill="#e2e8f0" font-size="12" font-weight="bold">📦 CATÁLOGO &amp; HERRAMIENTAS</text>

  <!-- Toolbag buttons -->
  <rect x="50" y="170" width="80" height="40" rx="6" fill="#1e293b" />
  <text x="90" y="195" fill="#38bdf8" font-size="9" text-anchor="middle">Pasta Térmica</text>
  <rect x="135" y="170" width="80" height="40" rx="6" fill="#1e293b" />
  <text x="175" y="195" fill="#f59e0b" font-size="9" text-anchor="middle">Plástico Cooler</text>
  <rect x="220" y="170" width="80" height="40" rx="6" fill="#1e293b" />
  <text x="260" y="195" fill="#10b981" font-size="9" text-anchor="middle">Alcohol IPA</text>

  <!-- Component Card 1 -->
  <rect x="50" y="225" width="250" height="70" rx="8" fill="#131e34" stroke="#0284c7" />
  <text x="65" y="247" fill="#ffffff" font-size="11" font-weight="bold">AMD Ryzen 7 7800X3D</text>
  <text x="65" y="265" fill="#94a3b8" font-size="10">Socket AM5 • 120W TDP • iGPU</text>
  <rect x="235" y="260" width="55" height="22" rx="4" fill="#0369a1" />
  <text x="262" y="275" fill="#ffffff" font-size="9" text-anchor="middle">Montado</text>

  <!-- Component Card 2 -->
  <rect x="50" y="305" width="250" height="70" rx="8" fill="#090d16" stroke="#1e293b" />
  <text x="65" y="327" fill="#ffffff" font-size="11" font-weight="bold">ASUS ROG STRIX B650-E</text>
  <text x="65" y="345" fill="#94a3b8" font-size="10">Socket AM5 • 4x DDR5 • ATX</text>

  <!-- Component Card 3 -->
  <rect x="50" y="385" width="250" height="70" rx="8" fill="#131e34" stroke="#0284c7" />
  <text x="65" y="407" fill="#ffffff" font-size="11" font-weight="bold">NVIDIA GeForce RTX 4080</text>
  <text x="65" y="425" fill="#94a3b8" font-size="10">320W TDP • PCIe 6+2Pin Alimentado</text>

  <!-- Center Column: Motherboard Canvas -->
  <rect x="330" y="130" width="540" height="510" rx="12" fill="#020617" stroke="#1e293b" />
  
  <!-- ATX Board PCB -->
  <rect x="350" y="145" width="500" height="480" rx="10" fill="#090d16" stroke="#334155" stroke-width="2" />
  <!-- VRM Heatsinks -->
  <rect x="380" y="165" width="35" height="120" rx="4" fill="#1e293b" stroke="#475569" />
  <rect x="420" y="165" width="120" height="28" rx="4" fill="#1e293b" stroke="#475569" />
  <!-- Socket CPU -->
  <rect x="430" y="200" width="100" height="100" rx="6" fill="#334155" stroke="#94a3b8" />
  <circle cx="480" cy="250" r="38" fill="#0284c7" stroke="#38bdf8" />
  <text x="480" y="254" fill="#ffffff" font-size="9" font-family="monospace" text-anchor="middle">AIO COOLER</text>
  
  <!-- RAM Slots 1-4 -->
  <rect x="560" y="180" width="10" height="130" rx="2" fill="#1e293b" />
  <rect x="580" y="180" width="10" height="130" rx="2" fill="#06b6d4" />
  <rect x="600" y="180" width="10" height="130" rx="2" fill="#1e293b" />
  <rect x="620" y="180" width="10" height="130" rx="2" fill="#06b6d4" />
  <text x="600" y="325" fill="#06b6d4" font-size="9" text-anchor="middle">Dual Channel (2 &amp; 4)</text>

  <!-- PCIe x16 GPU Card -->
  <rect x="380" y="340" width="380" height="80" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="430" cy="380" r="24" fill="#0284c7" />
  <circle cx="530" cy="380" r="24" fill="#0284c7" />
  <circle cx="630" cy="380" r="24" fill="#0284c7" />
  <text x="700" y="384" fill="#ffffff" font-size="10" font-weight="bold">RTX 4080</text>

  <!-- M.2 SSD Slot -->
  <rect x="430" y="305" width="140" height="22" rx="3" fill="#047857" stroke="#10b981" />
  <text x="500" y="320" fill="#ffffff" font-size="9" text-anchor="middle">Samsung 990 PRO NVMe</text>

  <!-- PSU Bay -->
  <rect x="360" y="490" width="180" height="120" rx="6" fill="#090d16" stroke="#0ea5e9" />
  <circle cx="450" cy="550" r="40" fill="#1e293b" />
  <text x="450" y="600" fill="#ffffff" font-size="10" text-anchor="middle">Seasonic 850W Gold</text>

  <!-- Right Column: Diagnostics Station -->
  <rect x="885" y="130" width="280" height="510" rx="12" fill="#0b1120" stroke="#1e293b" />
  <text x="900" y="155" fill="#10b981" font-size="12" font-weight="bold">🩺 DIAGNÓSTICO POST &amp; SEÑALES</text>

  <!-- 7-Segment Hex Display -->
  <rect x="900" y="170" width="70" height="55" rx="6" fill="#000000" stroke="#334155" />
  <text x="935" y="210" fill="#10b981" font-size="34" font-family="'Orbitron',monospace" font-weight="bold" text-anchor="middle">AA</text>
  <text x="980" y="190" fill="#ffffff" font-size="11" font-weight="bold">POST COMPLETADO</text>
  <text x="980" y="206" fill="#94a3b8" font-size="9">Control transferido al SO</text>

  <!-- 4 EZ Debug LEDs -->
  <rect x="900" y="235" width="250" height="55" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="915" y="252" fill="#94a3b8" font-size="9">EZ DEBUG LEDS (SMD):</text>
  <circle cx="930" cy="272" r="5" fill="#334155" />
  <text x="945" y="275" fill="#64748b" font-size="10">CPU</text>
  <circle cx="985" cy="272" r="5" fill="#334155" />
  <text x="1000" y="275" fill="#64748b" font-size="10">DRAM</text>
  <circle cx="1045" cy="272" r="5" fill="#334155" />
  <text x="1060" y="275" fill="#64748b" font-size="10">VGA</text>
  <circle cx="1105" cy="272" r="5" fill="#334155" />
  <text x="1120" y="275" fill="#64748b" font-size="10">BOOT</text>

  <!-- Multimeter Quick Gauge -->
  <rect x="900" y="300" width="250" height="95" rx="8" fill="#022c22" stroke="#059669" />
  <text x="915" y="320" fill="#34d399" font-size="10" font-weight="bold">⚡ MULTÍMETRO DIGITAL (FLUKE DMM):</text>
  <text x="915" y="352" fill="#10b981" font-size="24" font-family="monospace" font-weight="bold">+12.08 V DC</text>
  <text x="915" y="380" fill="#a7f3d0" font-size="10">✔ Tolerancia ATX ±5% (11.40V - 12.60V) Óptimo</text>

  <!-- POST Terminal Log -->
  <rect x="900" y="405" width="250" height="225" rx="8" fill="#000000" stroke="#1e293b" />
  <text x="915" y="425" fill="#38bdf8" font-size="9" font-family="monospace">&gt; 0x01 POWER_GOOD: OK</text>
  <text x="915" y="445" fill="#38bdf8" font-size="9" font-family="monospace">&gt; 0x15 MEMORY_INIT: DDR5-6000 OK</text>
  <text x="915" y="465" fill="#38bdf8" font-size="9" font-family="monospace">&gt; 0x2A VGA_ENUM: PCIe Gen5 x16 OK</text>
  <text x="915" y="485" fill="#38bdf8" font-size="9" font-family="monospace">&gt; 0x92 NVME_MOUNT: Samsung 990 OK</text>
  <text x="915" y="505" fill="#10b981" font-size="9" font-family="monospace">&gt; 0xAA BOOT_SUCCESS: UEFI Handover</text>
  <text x="915" y="535" fill="#a855f7" font-size="9" font-family="monospace">[BEEP] 1 Short Beep (880Hz) OK</text>
</svg>
